name: Build & Release APK+IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK (arm64, split-per-abi, obfuscated)
      run: flutter build apk --release --split-per-abi --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

    - name: Extract version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
        else
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build IPA
      run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols

    - name: Create IPA
      run: |
        mkdir Payload
        cp -r build/ios/iphoneos/Runner.app Payload/
        zip -r ePickle-iOS.ipa Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v3
      with:
        name: ios-ipa
        path: ePickle-iOS.ipa

  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Extract version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          echo "tag=v${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
        else
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Download APK
      uses: actions/download-artifact@v3
      with:
        name: android-apk

    - name: Download IPA
      uses: actions/download-artifact@v3
      with:
        name: ios-ipa

    - name: Create or Update Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ePickle v${{ steps.version.outputs.version }} UI修复版本
        body: |
          # ePickle v${{ steps.version.outputs.version }} 稳定版

          ## v2.6.1 UI 修复
          - 移除播放页可拖拽的重复返回按钮
          - 设置 / 全屏按钮上移至与标题平齐
          - 左上角返回按钮透明度与全屏按钮一致，去除阴影

          ## 体积优化
          - Android：R8 代码压缩 + 资源压缩 (shrinkResources)
          - 按 ABI 分包，仅 arm64 架构 (--target-platform android-arm64)
          - 代码混淆 + 分离调试符号 (--obfuscate --split-debug-info)
          - useLegacyPackaging，移除 cupertino_icons
          - arm64 单架构 APK，体积显著缩小

          ## 性能优化
          - MinimalButton / 播放时长 / 倍速采用 ValueNotifier 精准刷新，避免整页重建
          - VideoCard 包裹 RepaintBoundary，减少重绘范围

          ## 稳定性
          - CacheManager 扫描加并发上限，防止内存暴涨

          ## 设置页
          - 关闭按钮与标题下移，风格统一
          - 顶部下拉手势直接退出设置页

          iOS / Android 双端同步优化。
        files: |
          app-arm64-v8a-release.apk
          ePickle-iOS.ipa
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
